name: Daily Brainstorm

on:
  schedule:
    - cron: '30 0 * * *'   # UTC 00:30 = UTC+8 08:30
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-brainstorm
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LLM_PREFER: BIGMODEL,SENSENOVA
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: write run config from secrets
        run: |
          cat > .env <<ENVEOF
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL=https://api.deepseek.com/v1
          DEEPSEEK_MODEL=deepseek-v4-flash
          SENSENOVA_API_KEY=${{ secrets.SENSENOVA_API_KEY }}
          SENSENOVA_BASE_URL=https://token.sensenova.cn/v1
          SENSENOVA_MODEL=deepseek-v4-flash
          BIGMODEL_API_KEY=${{ secrets.BIGMODEL_API_KEY }}
          BIGMODEL_BASE_URL=https://open.bigmodel.cn/api/coding/paas/v4
          BIGMODEL_MODEL=glm-5.3-flash
          ENVEOF
          printf '%s' "${{ secrets.PROFILE_TEXT }}" > profile.md

      - name: pull worker discoveries (Cloudflare)
        env:
          CF_URL: ${{ secrets.FRONTIER_CF_URL }}
          CF_KEY: ${{ secrets.FRONTIER_CF_KEY }}
        run: |
          curl -s "$CF_URL/frontier.json?key=$CF_KEY" -o /tmp/cf.json || true
          node scripts/merge-cf.mjs /tmp/cf.json data/frontier-links.txt || true

      - name: collect (today's ideas)
        run: node collect.mjs

      - name: frontier (official accounts check)
        run: node frontier.mjs

      - name: commit data
        run: |
          git config user.name "brainstorm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "daily update $(date -u +%F)"
          git pull --rebase -q origin main || true
          git push
